
# ============================================
# CI/CD Pipeline for Machine Learning Model
# Project: Iris Flower Classification
# Platform: GitHub Actions
# ============================================

name: ML Model CI-CD Pipeline

# Trigger workflow when code is pushed to main
# or when manually started from GitHub Actions.

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read

# Prevent unnecessary simultaneous deployments
concurrency:
  group: iris-ml-pages
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================

  ci:
    name: ML Model Build and Testing

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute ML model
      - name: Train and Run ML Model
        run: |
          python model.py

      # Step 5: Verify results file
      - name: Verify ML Results
        run: |
          python -c "import json; d=json.load(open('results.json')); assert 0 <= d['accuracy'] <= 100; print('Model Accuracy:', d['accuracy'], '%')"

      # Step 6: Run automated tests
      - name: Execute Pytest Test Cases
        run: |
          pytest -v

      # Step 7: Prepare website files
      - name: Prepare Deployment Files
        run: |
          mkdir public
          cp index.html public/
          cp results.json public/

      # Step 8: Upload deployment artifact
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================

  deploy:
    name: Deploy ML Dashboard

    # CD depends on successful CI execution
    needs: ci

    # Deploy only when CI succeeds
    if: needs.ci.result == 'success'

    runs-on: ubuntu-latest

    # GitHub Pages deployment permissions
    permissions:
      pages: write
      id-token: write

    # GitHub Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Step 1: Deploy website to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
